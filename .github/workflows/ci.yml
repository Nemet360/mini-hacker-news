name: ci

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint every commit on the branch
        run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
      - name: Hook test vectors
        run: bash scripts/test-hooks.sh

  build-test:
    runs-on: ubuntu-latest
    # PostgreSQL for the integration tests and the README smoke. Same major as
    # docker-compose.yml and the Testcontainers image. The credentials exist only
    # inside this throwaway job container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_PG_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      ConnectionStrings__Posts: Host=localhost;Port=5432;Database=minihn;Username=postgres;Password=postgres
      SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
      - run: dotnet tool restore
      # Dependabot bumps a version without regenerating the committed lock files,
      # so --locked-mode fails its pull requests with NU1004 - a true statement
      # about the lock file and a useless one about the change. Its branches
      # restore without the flag and the lock files are refreshed when the bump is
      # taken; every human branch is still held to the lock.
      - name: Restore
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            dotnet restore
          else
            dotnet restore --locked-mode
          fi
      - run: dotnet build --no-restore -c Release
      - name: Migrations snapshot is in sync with the model
        run: dotnet ef migrations has-pending-model-changes --project src/MiniHn.Api
      - name: Test with coverage (the script the README documents)
        env:
          CONFIGURATION: Release
          EXTRA_TEST_ARGS: --no-build
        run: bash scripts/coverage.sh
      - name: Coverage into the job summary
        if: always()
        run: |
          {
            echo '## Test coverage'
            cat coverage/report/SummaryGithub.md
          } >> "$GITHUB_STEP_SUMMARY"
      # The coverage block already ran above, so the smoke skips it.
      - name: The README's own commands, so the docs cannot rot
        env:
          SKIP_COVERAGE: '1'
        run: bash scripts/readme-smoke.sh
      - name: docker-compose.yml brings up a healthy PostgreSQL
        run: bash scripts/compose-smoke.sh
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-pr
          path: |
            coverage/**/coverage.cobertura.xml
            coverage/report/Cobertura.xml
            coverage/report/SummaryGithub.md

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - run: dotnet format --verify-no-changes

  vulnerable-packages:
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans the pushed range and cannot resolve <sha>^
      # on a shallow checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
      - name: Fail on any vulnerable or deprecated package
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          grep -q "no vulnerable packages" vuln.txt
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage-gate:
    needs: build-test
    runs-on: ubuntu-latest
    # Only this job writes to the pull request: the coverage comment.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-pr
          path: pr-coverage
      - name: Download the baseline produced by main
        id: baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: main.yml
          branch: main
          name: coverage-main
          path: base-coverage
      # Floors: line >= 90% is the M10 gate. Branch >= 75% is the M1 baseline the
      # ratchet must not go under.
      - name: Coverage floors (line 90%, branch 75%) and no drop against main beyond 0.5pp
        id: gate
        run: python3 scripts/coverage_gate.py pr-coverage base-coverage 0.5 --min-line 90 --min-branch 75 --comment coverage-comment.md
      # One comment per pull request, edited in place on every push. A token that
      # cannot write (Dependabot, forks) skips it rather than failing the gate.
      - name: Coverage comment on the pull request
        if: always() && hashFiles('coverage-comment.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file coverage-comment.md --edit-last --create-if-none

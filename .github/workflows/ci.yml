name: ci

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint every commit on the branch
        run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
      - name: Hook test vectors
        run: bash scripts/test-hooks.sh

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
      - run: dotnet tool restore
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - name: Migrations snapshot is in sync with the model
        run: dotnet ef migrations has-pending-model-changes --project src/MiniHn.Api
      - run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory coverage
      - name: The README's own commands, so the docs cannot rot
        run: bash scripts/readme-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-pr
          path: coverage/**/coverage.cobertura.xml

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
      - run: dotnet format --verify-no-changes

  vulnerable-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
      - name: Fail on any vulnerable or deprecated package
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          grep -q "no vulnerable packages" vuln.txt
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage-gate:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-pr
          path: pr-coverage
      - name: Download the baseline produced by main
        id: baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: main.yml
          branch: main
          name: coverage-main
          path: base-coverage
      - name: Compare line coverage against main, 0.5pp tolerance
        run: python3 scripts/coverage_gate.py pr-coverage base-coverage 0.5

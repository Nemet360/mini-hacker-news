name: release

# Minimal delivery: a version tag becomes a GitHub Release carrying the published
# API and the coverage it was released with. The container image is M14; the
# deploy is M15.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_PG_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      # Full history, so MinVer can read the version from the tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
      - run: dotnet tool restore
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release

      - name: Test with coverage
        env:
          CONFIGURATION: Release
          EXTRA_TEST_ARGS: --no-build
        run: bash scripts/coverage.sh

      # A release must clear the same floors a pull request does.
      - name: Coverage floors (line 90%, branch 75%)
        run: python3 scripts/coverage_gate.py coverage none 0 --min-line 90 --min-branch 75

      - name: Publish
        run: dotnet publish src/MiniHn.Api -c Release -o publish --no-build

      - name: Package
        id: package
        run: |
          archive="minihn-api-${GITHUB_REF_NAME}.zip"
          (cd publish && zip -qr "../$archive" .)
          cp coverage/report/Summary.txt "coverage-${GITHUB_REF_NAME}.txt"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Coverage at this release'
            echo
            cat coverage/report/SummaryGithub.md
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --generate-notes \
            "${{ steps.package.outputs.archive }}" \
            "coverage-${GITHUB_REF_NAME}.txt"

name: build

# The project's build, on every push and on demand. The pull-request gate lives
# in ci.yml and adds the commit linter, the formatter and the coverage ratchet;
# this workflow answers one question only: does the repository build and pass
# its tests, on a clean machine, from the SDK pinned in global.json.

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    # PostgreSQL for the integration tests and the README smoke. Same major as
    # docker-compose.yml and the Testcontainers image. The credentials exist only
    # inside this throwaway job container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_PG_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      ConnectionStrings__Posts: Host=localhost;Port=5432;Database=minihn;Username=postgres;Password=postgres
      SMOKE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Use the SDK pinned in global.json
        uses: actions/setup-dotnet@v6

      - run: dotnet --version

      - name: Restore local tools (dotnet-ef, reportgenerator)
        run: dotnet tool restore

      - name: Restore packages against the committed lock files
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: The migration snapshot matches the model
        run: dotnet ef migrations has-pending-model-changes --project src/MiniHn.Api

      # The very script the README documents, so a reader's numbers and these
      # numbers cannot be different numbers.
      - name: Test with coverage
        env:
          CONFIGURATION: Release
          EXTRA_TEST_ARGS: --no-build --logger trx;LogFileName=tests.trx
        run: bash scripts/coverage.sh

      - name: Coverage into the job summary
        if: always()
        run: |
          {
            echo '## Test coverage'
            cat coverage/report/SummaryGithub.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The coverage block is already proven above, so it is skipped here rather
      # than run a second time.
      - name: The README's own run instructions still work
        env:
          SKIP_COVERAGE: '1'
        run: bash scripts/readme-smoke.sh

      - name: Coverage floors (line 90%, branch 75%)
        run: python3 scripts/coverage_gate.py coverage none 0 --min-line 90 --min-branch 75

      - name: Publish a self-contained-free release build
        run: dotnet publish src/MiniHn.Api -c Release -o publish --no-build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-output
          path: |
            publish/**
            coverage/**/coverage.cobertura.xml
            coverage/report/Summary.txt
            coverage/report/badge_linecoverage.svg
            coverage/report/badge_branchcoverage.svg
            **/*.trx
          retention-days: 14

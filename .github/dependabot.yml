version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      efcore:
        patterns: [ "Microsoft.EntityFrameworkCore*" ]
      test-stack:
        patterns: [ "xunit*", "FluentAssertions", "coverlet*", "Microsoft.NET.Test.Sdk" ]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
